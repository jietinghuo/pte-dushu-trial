*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(165deg,#eef2ff,#faf5ff);color:#222;padding:18px;line-height:1.8;}
.wrap{max-width:900px;margin:0 auto;}
h1{font-size:23px;color:#2e1065;margin-bottom:6px;}
.intro{color:#6b7280;font-size:13.5px;margin-bottom:14px;}

.qlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px;padding:10px;border:1px solid #e9e2fa;border-radius:12px;background:#fff;}
.qlist .lab{width:100%;font-size:12px;color:#7c6ba6;margin-bottom:2px;font-weight:700;}
.qlist button{padding:6px 11px;border:1.5px solid #d6cdfa;border-radius:20px;background:#fff;color:#5b21b6;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;}
.qlist button:hover{background:#f3eefe;}

.txt{flex:1;font-size:14.5px;line-height:1.8;}

.mark.ok{color:#16a34a;}

.memo{margin:14px 0;padding:14px 16px;background:#fffbeb;border:1.5px solid #fde68a;border-radius:14px;}

.mzh{font-size:13.5px;color:#b45309;line-height:1.7;margin-top:2px;padding-left:2px;}

const ORDER = Object.keys(DATA).sort((a,b)=>(+a)-(+b));
const CONN_COLOR = "#9d174d";
let cur = ORDER[0];
let order = [];

const $ = id => document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function computeAnte(q){
  const d=DATA[q], sents=d.sentences;
  d.links.forEach(l=>{
    l.anteIdx=-1;
    if(l.ante){
      const t=l.ante.toLowerCase();
      for(let i=l.to-2;i>=0;i--){
        if(sents[i].toLowerCase().indexOf(t)!==-1){l.anteIdx=i;break;}
      }
    }
  });
}

function renderList(){
  const box=$("qlist");
  ORDER.forEach(q=>{
    const b=document.createElement("button");
    b.textContent=`#${q}`;
    b.dataset.q=q;
    if(q===cur)b.classList.add("active");
    b.onclick=()=>load(q);
    box.appendChild(b);
  });
}
function markActive(){
  document.querySelectorAll("#qlist button").forEach(b=>{
    b.classList.toggle("active", b.dataset.q===cur);
  });
}

function renderPractice(){
  const d=DATA[cur], box=$("practice"); box.innerHTML="";
  order.forEach((si,pos)=>{
    const card=document.createElement("div");
    card.className="card"; card.draggable=true; card.dataset.pos=pos;
    card.innerHTML=`<div class="num">${pos+1}</div>`+
      `<div class="txt">${esc(d.sentences[si])}</div>`+
      `<div class="move"><button data-dir="up">▲</button><button data-dir="down">▼</button></div>`+
      `<div class="mark" id="mk${pos}"></div>`;
    card.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",pos);card.classList.add("dragging");});
    card.addEventListener("dragend",()=>card.classList.remove("dragging"));
    card.addEventListener("dragover",e=>{e.preventDefault();});
    card.addEventListener("drop",e=>{e.preventDefault();const from=+e.dataTransfer.getData("text/plain");move(from,pos);});
    card.querySelector('[data-dir="up"]').onclick=()=>move(pos,pos-1);
    card.querySelector('[data-dir="down"]').onclick=()=>move(pos,pos+1);
    box.appendChild(card);
  });
  $("score").textContent="";
}

function move(from,to){
  if(from<0||from>=order.length||to<0||to>=order.length||from===to)return;
  const [x]=order.splice(from,1);order.splice(to,0,x);
  renderPractice();
}

function check(){
  const n=order.length;let right=0;
  order.forEach((si,pos)=>{
    const ok=(si===pos);if(ok)right++;
    const mk=$("mk"+pos);if(mk){mk.textContent=ok?"✓":"✗";mk.className="mark "+(ok?"ok":"no");}
    const card=document.querySelectorAll(".card")[pos];
    if(card)card.className="card "+(ok?"ok":"no");
  });
  $("score").textContent=`得分：${right} / ${n} 正确`+(right===n?" 🎉 完全正确！":"（绿=位置对，红=位置错）");
}

function applyHighlights(text, marks){
  const e = esc(text);
  const lower = e.toLowerCase();
  const used = [];
  const ranges = [];
  marks.slice().sort((a,b)=>b.phrase.length-a.phrase.length).forEach(m=>{
    const ph=m.phrase.toLowerCase();
    if(!ph)return;
    let idx=lower.indexOf(ph);
    while(idx!==-1){
      const end=idx+ph.length;
      const overlap=used.some(u=>!(end<=u[0]||idx>=u[1]));
      if(!overlap){ranges.push({s:idx,e:end,c:m.color,k:m.kind});used.push([idx,end]);break;}
      idx=lower.indexOf(ph,end);
    }
  });
  ranges.sort((a,b)=>a.s-b.s);
  let out="",pos=0;
  ranges.forEach(r=>{
    if(r.k==="conn"){
      out+=e.slice(pos,r.s)+`<span class="hl conn">`+e.slice(r.s,r.e)+`</span>`;
    }else{
      out+=e.slice(pos,r.s)+`<span class="hl" style="background:${r.c}">`+e.slice(r.s,r.e)+`</span>`;
    }
    pos=r.e;
  });
  out+=e.slice(pos);
  return out;
}

function renderExplain(){
  const d=DATA[cur], box=$("explain");
  computeAnte(cur);
  let h=`<h2>🔍 RO #${cur} 解析（关系图 + 逐句讲解）</h2>`;
  if(GRAPHS[cur])h+=`<div class="ro-graph"><img src="${GRAPHS[cur]}" alt="RO #${cur} 关系图"></div>`;
  if(d.cn)h+=`<div class="q-cn">📌 <b>中文翻译：</b><br>${esc(d.cn).replace(/\n/g,"<br>")}</div>`;
  if(d.first)h+=`<div class="firstbox">🔍 <b>首句信号：</b>${esc(d.first)}</div>`;
  if(d.memo)h+=`<div class="oneliner">💡 <b>一句话记忆：</b>${esc(d.memo)}</div>`;
  h+=`<div class="esec">📖 逐句解析（同色 = 指代/衔接；<span style="color:${CONN_COLOR};font-weight:800;text-decoration:underline;">下划线</span> = 关联词）</div>`;
  d.sentences.forEach((s,si)=>{
    const marks=[];
    d.links.forEach(l=>{
      if(l.to-1===si){l.ref.split(" / ").forEach(p=>{if(p)marks.push({phrase:p,color:l.color,kind:"ref"});});}
      if(l.anteIdx===si&&l.ante){marks.push({phrase:l.ante,color:l.color,kind:"ref"});}
    });
    d.conns.forEach(c=>{
      if((c.to-1)===si&&c.word){marks.push({phrase:c.word,color:CONN_COLOR,kind:"conn"});}
    });
    h+=`<div class="esent"><span class="e-num">${si+1}.</span>${applyHighlights(s,marks)}</div>`;
  });
  h+=`<div class="legend"><b>🎨 指代 / 衔接关系（同色 = 相连）：</b></div>`;
  d.links.forEach(l=>{
    const src=(l.anteIdx>=0)?(l.anteIdx+1):(l.from);
    const anteTxt=l.ante?`『${esc(l.ante)}』`:`句${l.from}整体`;
    h+=`<div class="rel" style="border-left-color:${l.color}">`+
       `<span style="color:${l.color};font-weight:800">●</span> `+
       `句${l.to}『${esc(l.ref)}』 <b>←</b> 句${src}${anteTxt}`+
       `<div class="relnote">${esc(l.note)}</div></div>`;
  });
  h+=`<details class="det"><summary>✅ 正确答案顺序（点开查看，做题时建议先别看）</summary><ol class="anslist">`;
  d.sentences.forEach((s,i)=>{h+=`<li><b>${i+1}.</b> ${esc(s)}</li>`;});
  h+=`</ol></details>`;
  if(d.skill){
    h+=`<details class="det" open><summary>🎯 做题技巧（点开可收起）</summary><div class="skillbox"><ol>`;
    d.skill.split(/①|②|③|④|⑤/).forEach(it=>{
      it=it.trim().replace(/^[）).:：\s]+/,"").trim();
      if(it)h+=`<li>${esc(it)}</li>`;
    });
    h+=`</ol></div></details>`;
  }
  // ---- 记忆辅助：中文翻译 + 正确顺序（帮助背诵）----
  if(d.cn_list && d.cn_list.length){
    h+=`<div class="memo"><h3>📝 记忆辅助 · 中文翻译 + 正确顺序</h3>`;
    h+=`<p class="memohint">按正确顺序对照英文与中文，帮助背诵记忆：</p>`;
    d.sentences.forEach((s,i)=>{
      const zh=(d.cn_list[i]||"").trim();
      h+=`<div class="memorow"><div class="meno">${i+1}. ${esc(s)}</div>`;
      if(zh)h+=`<div class="mzh">🇨🇳 ${esc(zh)}</div>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  box.innerHTML=h;
}

function load(q){
  cur=q; order=shuffle(DATA[q].sentences.map((_,i)=>i));
  markActive();
  renderPractice(); renderExplain();
  $("score").textContent="";
}

$("shuffle").onclick=()=>load(cur);
$("check").onclick=check;

renderList(); load(cur);
</script>
</body></html>
